controller:
  hero_chassis_controller:
    type: hero_chassis_controller/HeroChassisController

    joints:
      front_left: left_front_wheel_joint
      front_right: right_front_wheel_joint
      rear_left: left_back_wheel_joint
      rear_right: right_back_wheel_joint

    wheel_radius: 0.07625
    wheel_base: 0.4
    wheel_track: 0.4
    maximum_wheel_speed: 50.0
    maximum_wheel_effort: 5.0

    command_frame: base_link
    odom_frame: odom
    base_frame: base_link

    command_timeout: 0.5
    publish_rate: 50.0
    linear_acceleration_limit: 1.0
    angular_acceleration_limit: 2.0

    pids:
      front_left:
        p: 1.0
        i: 0.0
        d: 0.0
        i_clamp: 0.0
        antiwindup: false
        publish_state: true
      front_right:
        p: 1.0
        i: 0.0
        d: 0.0
        i_clamp: 0.0
        antiwindup: false
        publish_state: true
      rear_left:
        p: 1.0
        i: 0.0
        d: 0.0
        i_clamp: 0.0
        antiwindup: false
        publish_state: true
      rear_right:
        p: 1.0
        i: 0.0
        d: 0.0
        i_clamp: 0.0
        antiwindup: false
        publish_state: true

  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50
